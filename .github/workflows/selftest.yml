# Temporary: revoke the self-test key, then this file is removed (a listed action repository must not contain workflows).
name: selftest-cleanup
on:
  workflow_dispatch:
jobs:
  revoke:
    runs-on: ubuntu-latest
    steps:
      - name: revoke the self-test key
        shell: bash
        env:
          JANCTION_RENDER_API_KEY: ${{ secrets.JANCTION_RENDER_API_KEY }}
          JANCTION_RENDER_CLIENT: smoke/render-action-ci
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip install -q janction-render==0.4.41
          /tmp/v/bin/janction-render revoke-key --yes | grep -o '"revoked": "[^"]*"'
